[package]
name = "hubullu"
version = "0.1.0"
edition = "2021"
description = "Hubullu compiler — compiles .hu artificial natural language dictionary files to .huc"
license = "MIT"
rust-version = "1.70"

[features]
default = ["sqlite", "cli"]
sqlite = ["dep:rusqlite", "dep:sha2", "serialization", "dep:serde_json", "dep:bincode"]
cli = ["dep:clap", "dep:env_logger", "sqlite", "lsp"]
serialization = ["dep:serde"]
lsp = ["dep:crossbeam-channel", "dep:lsp-server", "dep:lsp-types", "dep:serde_json", "dep:notify", "serialization"]

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
sha2 = { version = "0.10", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
crossbeam-channel = { version = "0.5", optional = true }
lsp-server = { version = "0.7", optional = true }
lsp-types = { version = "0.97", optional = true }
serde_json = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
bincode = { version = "1", optional = true }
notify = { version = "6", optional = true }
log = "0.4"
env_logger = { version = "0.11", optional = true }
thiserror = "1"
unicode-xid = "0.2"
# F1 (FST migration foundation): rustfst is wrapped behind src/fst/ trait surface.
# Pinned to >= 1.2.6 per rustfst-survey.md (TrivialWeight + WeaklyDivisibleSemiring fixes).
rustfst = "1.3"
anyhow = "1"

[[bin]]
name = "hubullu"
required-features = ["cli"]

[dev-dependencies]
insta = "1"
tempfile = "3"
